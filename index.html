<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>포트폴리오</title>
  <meta name="description" content="생활에 필요한 작은 앱을 직접 만들어요.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">

  <!-- 글꼴 (구글 폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">

  <!-- 꾸미기 파일 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 맨 위: 이름과 소개 (내용은 script.js에서 바꿔요) -->
    <header class="hero">
      <p class="hello">안녕하세요,</p>
      <h1 id="name">내 이름</h1>
      <p class="intro" id="intro">생활에 필요한 작은 앱을 직접 만들어요.</p>
    </header>

    <!-- 만든 것 목록 (내용은 script.js에서 바꿔요) -->
    <section class="works" aria-labelledby="works-title">
      <h2 id="works-title">만든 것</h2>
      <ul class="work-list" id="work-list"></ul>
      <noscript><p class="note">목록을 보려면 자바스크립트를 켜주세요.</p></noscript>
    </section>

    <!-- 맨 아래: 연락처 -->
    <footer class="foot" id="foot"></footer>

  </main>

  <!-- 움직임 파일 -->
  <script src="script.js"></script>
</body>
</html>
